<section class="section programs">
  <div class="section-title reveal">
    <p class="label">PROGRAMS</p>
    <h2>
      Gentle, Bomb,<br />
      그리고 Weekend.
    </h2>
  </div>

  <div class="program-apple reveal">
    <div class="program-accordion">
      <button class="program-item active" type="button" data-program="gentle">
        <div class="program-item-head">
          <span class="plus">+</span>
          <strong>Gentle</strong>
        </div>
        <p>
          처음부터 무리하지 않고, 기본기를 만드는 수업입니다.
          Gentle Strength는 움직임과 근력의 기초를 만들고,
          Gentle Sweat는 부담스럽지 않은 강도로 체력과 심폐지구력을 키웁니다.
        </p>
      </button>

      <button class="program-item" type="button" data-program="bomb">
        <div class="program-item-head">
          <span class="plus">+</span>
          <strong>Bomb</strong>
        </div>
        <p>
          더 강하게 땀 흘리고, 수행능력을 끌어올리는 수업입니다.
          Bomb Strength는 도전적인 근력 트레이닝,
          Bomb Sweat는 고강도 컨디셔닝으로 진행됩니다.
        </p>
      </button>

      <button class="program-item" type="button" data-program="weekend">
        <div class="program-item-head">
          <span class="plus">+</span>
          <strong>Weekend</strong>
        </div>
        <p>
          놀토짐의 팀 분위기와 에너지를 느끼는 90분 수업입니다.
          토요일 Nolto & Team, 일요일 No More Weak로
          더 깊게 몰입하는 주말 프로그램입니다.
        </p>
      </button>
    </div>

    <div class="program-art" id="programArt">
      <div class="art-text">
        <span id="artLabel">GENTLE</span>
        <strong id="artTitle">MOVE BETTER</strong>
      </div>
    </div>
  </div>
</section>
